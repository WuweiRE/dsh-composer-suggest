# Composer suggestions: after a turn ends the Host streams follow-up messages;
# when you press Tab at the end of a draft it streams continuations of that draft.
# The Client renders ghost text and accepts it on Tab (Alt+Down cycles candidates).
- insert:
    - id: composer-suggest
      name: dsh-composer-suggest
      config:
        # Empty: suggestions are answered by the model the Session already uses.
        # Name a model id to pin it instead, e.g. `model: claude-sonnet-5-5`. Without a
        # `provider` it is looked up among the providers mounted in this profile (the
        # Session's provider first); with both set the route is used exactly as given.
        model: ''
        # provider: claude2
        # A little thinking is worth its second or so: with thinking off, deepseek-flash
        # gave fewer distinct continuations. Falls back to the model's first advertised
        # effort when "low" is not offered. No temperature is sent.
        reasoningEffort: low
        # Thinking counts toward this cap; three candidates alone need under 100 tokens.
        maxOutputTokens: 2048
        timeoutMs: 30000
        maxSuggestions: 3
        # Prompt for both modes. A turn (what you typed plus the agent's final reply) counts
        # as two messages, so 10 shows the last five turns; the latest reply gets up to
        # 3200 of the characters, the older turns share the rest.
        maxMessages: 10
        maxChars: 8000
        # Tool calls of the latest turn that are listed after the conversation.
        maxToolNotes: 6
